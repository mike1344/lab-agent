name: CI

# 代码质量门禁 + 测试 + 镜像构建，PR 必须全绿才能合并。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端（ruff + unittest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI 没有 backend/.env，Settings 需要的最小变量在这里提供
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      JWT_EXPIRE_HOURS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 代码检查（ruff check）
        run: ruff check .
      - name: 格式检查（ruff format）
        run: ruff format --check .
      - name: 回归测试（SQLite）
        env:
          OPENAI_API_KEY: ""
          SCHEDULER_ENABLED: "false"
        run: python -m unittest discover -s tests

  frontend:
    name: 前端（测试 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fronted/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单元测试
        run: npm test
      - name: 生产构建
        run: npm run build

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -t lab-agent-backend:ci ./backend
      - name: 构建前端镜像
        run: docker build -t lab-agent-frontend:ci ./fronted
