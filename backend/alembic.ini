# Alembic configuration.
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale encoding,
# so non-ASCII comments may crash on GBK/CP936 systems.
# The database URL is not configured here: alembic/env.py reads backend/.env directly.

[alembic]
# Directory of migration scripts (relative to this file).
script_location = alembic
# Add backend/ to sys.path when running migrations, so "import app" works.
prepend_sys_path = .
# Injected by env.py; keep empty here.
sqlalchemy.url =
