# ============================================================
# 智能实验室预约系统 - Docker Compose 一键部署
#
# 启动：docker compose up -d --build
# 浏览：http://服务器IP（默认 80 端口，可在 .env 中用 WEB_PORT 修改）
#
# 首次使用建议：复制 .env.docker.example 为 .env 并修改密码与 JWT 密钥。
# 未提供 .env 时会使用下面标 [默认值] 的弱口令启动——只够本机跑通演示，
# 上线公共服务器前务必修改。完整说明见 DEPLOY.md。
# ============================================================

name: lab_agent

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.4
    container_name: lab_agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lab_agent_root_pwd}   # [默认值] 未配置 .env 时的临时口令
      MYSQL_DATABASE: lab_agent
      MYSQL_USER: lab_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab_agent_pwd}                  # [默认值] 同上
      TZ: Asia/Shanghai
    # 统一字符集与时区：datetime 默认值、NOW() 与服务端时间保持一致（预约时间敏感）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 数据库就绪（ping 通）后，后端容器才会启动
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # 如需在宿主机用 Navicat 等工具连接数据库调试，取消下面两行注释
    # ports:
    #   - "3306:3306"

  # ---------- 后端 FastAPI ----------
  backend:
    build:
      context: ./backend
    container_name: lab_agent_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 与 backend/.env 相同的配置项，这里通过环境变量注入（容器内不需要 .env 文件）。
      # 注意：密码请只用字母数字，避免特殊字符在连接串里需要转义。
      DATABASE_URL: 'mysql+pymysql://lab_agent:${MYSQL_PASSWORD:-lab_agent_pwd}@mysql:3306/lab_agent'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-this-jwt-secret}  # [默认值] 上线前必须改
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      JWT_ALGORITHM: HS256
      # 前后端同源部署（默认方案）用不到跨域；前端单独部署到其他域名时再修改
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # 表结构完全交给启动时的 alembic upgrade head，应用不再隐式建表
      AUTO_CREATE_TABLES: "false"
      # 关闭 ChromaDB 匿名遥测：离线服务器上会持续刷网络失败日志
      ANONYMIZED_TELEMETRY: "False"
      TZ: Asia/Shanghai
      # AI 助手（可选）：不填 Key 时自动使用本地知识库，功能不受影响
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      # Uvicorn 进程数：AI 流式长连接，2 个起步；低配机器（1核1G）改 1
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      # 持久化：上传的图片 + 知识库向量索引，容器重建不丢
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- 前端 Nginx ----------
  frontend:
    build:
      context: ./fronted
      args:
        # 前端与后端同源（Nginx 转发 /api、/uploads），axios 基地址用 /
        VITE_API_BASE_URL: /
    container_name: lab_agent_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  # 数据卷：docker compose down 不会删除；只有 docker compose down -v 才会清空（慎用！）
  mysql_data:
  uploads_data:
  chroma_data:
