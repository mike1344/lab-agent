# ============================================================
# 智能实验室预约系统 - Nginx 站点配置（运行在前端容器内）
# 职责：
#   1. 托管 Vue 打包产物（history 路由刷新时回退到 index.html）
#   2. 把 /api、/uploads、/health 反向代理给后端容器（/api/ws/ 为 WebSocket 升级代理）
# ============================================================
server {
    listen 80;
    server_name _;

    # 上传接口本身限 5MB，这里放宽到 10MB 留出请求头余量（超出会返回 413）
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩（js/css 体积通常能减少一大半）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 前端 history 路由：真实文件不存在时回退给 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 实时通知（/api/ws/notifications）：单独 location 配置协议升级头。
    # nginx 按最长前缀匹配，/api/ws/ 优先于 /api/ 命中，不影响普通接口代理。
    # 没有 Upgrade/Connection 头时握手会退化成普通 HTTP 请求，连接立即被关闭。
    # 心跳 25 秒一次，1 小时读超时足以容忍网络抖动；必须 HTTP/1.1（WS 升级要求）。
    location /api/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端接口反向代理（location 带斜杠 + proxy_pass 不带斜杠 = 完整路径原样转发）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 助手问答是 SSE 流式返回：必须关闭缓冲，否则要等整段回答生成完才显示；
        # 读取超时放宽到 5 分钟，避免长回答被中途断开。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 用户上传的图片：后端返回的是 /uploads/xxx.jpg 相对地址，需要同源转发
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 服务探活接口（返回 {"status":"ok"}）：给监控/巡检使用，不记访问日志
    location = /health {
        proxy_pass http://backend:8000;
        access_log off;
    }
}
